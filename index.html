<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdoSMP — Official Server</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #060608;
            --card-bg: rgba(14, 14, 20, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --gold-primary: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #9e9ebd;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated Epic Background Flag */
        .bg-flag-wrapper {
            position: absolute;
            inset: -10%;
            z-index: 0;
            display: flex;
            flex-direction: column;
            opacity: 0.22;
            filter: blur(40px);
            transform: scale(1.1) rotate(-3deg);
            animation: flagWave 12s infinite ease-in-out alternate;
            pointer-events: none;
        }

        .bg-stripe-red {
            background: linear-gradient(90deg, #EE2324 0%, #ff4d4d 100%);
            flex: 1;
        }

        .bg-stripe-white {
            background: #FFFFFF;
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-stripe-green {
            background: linear-gradient(90deg, #007A3D 0%, #00b359 100%);
            flex: 1;
        }

        /* Rotating Background Sunburst */
        .bg-sun-burst {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(254, 204, 0, 0.8) 0%, rgba(254, 204, 0, 0) 70%);
            border-radius: 50%;
            animation: spinSun 25s linear infinite;
        }

        @keyframes flagWave {
            0% { transform: scale(1.08) rotate(-3deg) translateY(-10px); }
            50% { transform: scale(1.15) rotate(1deg) translateY(10px); }
            100% { transform: scale(1.08) rotate(-3deg) translateY(-10px); }
        }

        @keyframes spinSun {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Ambient Center Glow */
        .ambient-gold {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 183, 0, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Card Container */
        .card {
            position: relative;
            z-index: 10;
            max-width: 540px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 48px 36px;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        /* Server Title Banner */
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 183, 0, 0.1);
            border: 1px solid rgba(255, 183, 0, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            margin-bottom: 24px;
        }

        .brand-badge i {
            color: var(--gold-primary);
            font-size: 0.9rem;
        }

        .brand-badge span {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--gold-primary);
            text-transform: uppercase;
        }

        /* Headings */
        h1 {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #FFFFFF 20%, #a0a0b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        h1 span {
            background: linear-gradient(135deg, #ffc837 0%, #ff8000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        /* Interactive Copy IP Container */
        .ip-wrapper {
            margin-bottom: 24px;
        }

        .ip-box {
            background: rgba(10, 10, 15, 0.85);
            border: 1px dashed rgba(255, 183, 0, 0.4);
            border-radius: 18px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .ip-box:hover {
            border-color: var(--gold-primary);
            border-style: solid;
            background: rgba(20, 20, 28, 0.95);
            box-shadow: 0 12px 35px var(--gold-glow);
            transform: translateY(-3px);
        }

        .ip-details {
            text-align: left;
        }

        .ip-details span {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .ip-details strong {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.35rem;
            color: #ffffff;
            font-weight: 800;
        }

        .copy-btn {
            background: var(--gold-primary);
            color: #0d0d12;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .ip-box:hover .copy-btn {
            background: #ffd000;
            transform: scale(1.03);
        }

        /* Server Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--card-border);
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 32px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            position: relative;
        }

        .pulse-dot.online {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .pulse-dot.online::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 1.8s infinite ease-in-out;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .pulse-dot.offline { background: var(--danger); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        /* Buttons Layout */
        .actions {
            display: flex;
            gap: 14px;
        }

        .action-btn {
            flex: 1;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .action-btn.discord {
            background: rgba(88, 101, 242, 0.15);
            border-color: rgba(88, 101, 242, 0.35);
            color: #7289da;
        }

        .action-btn.discord:hover {
            background: rgba(88, 101, 242, 0.3);
            border-color: rgba(88, 101, 242, 0.6);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.25);
        }

        /* Toast Popup Notification */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold-primary);
            color: #0d0d12;
            padding: 12px 26px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px var(--gold-glow);
            transition: bottom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            bottom: 30px;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 20px; }
            h1 { font-size: 2.2rem; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Animated Epic Flag Background -->
    <div class="bg-flag-wrapper">
        <div class="bg-stripe-red"></div>
        <div class="bg-stripe-white">
            <div class="bg-sun-burst"></div>
        </div>
        <div class="bg-stripe-green"></div>
    </div>

    <div class="ambient-gold"></div>

    <!-- Central Card -->
    <div class="card">
        
        <div class="brand-badge">
            <i class="fa-solid fa-crown"></i>
            <span>KurdoSMP Official</span>
        </div>

        <h1>Website Under <span>Construction</span></h1>
        <p class="description">Our official web ecosystem is currently being upgraded. Join the Minecraft server directly or hop into our Discord community below!</p>

        <!-- Copy IP Box -->
        <div class="ip-wrapper">
            <div class="ip-box" id="ip-card">
                <div class="ip-details">
                    <span>Server Address</span>
                    <strong>kurdosmp.net</strong>
                </div>
                <div class="copy-btn">
                    <i class="fa-regular fa-copy"></i> Copy IP
                </div>
            </div>
        </div>

        <!-- Live Server Status -->
        <div class="status-badge">
            <div class="pulse-dot" id="status-dot"></div>
            <span id="player-count">Checking network status...</span>
        </div>

        <!-- Buttons -->
        <div class="actions">
            <a href="https://dsc.gg/kurdosmp" target="_blank" class="action-btn discord">
                <i class="fa-brands fa-discord"></i> Discord Community
            </a>
            <a href="https://store.kurdosmp.net" target="_blank" class="action-btn">
                <i class="fa-solid fa-cart-shopping"></i> Web Store
            </a>
        </div>
    </div>

    <!-- Copy Alert Popup -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> IP Copied to Clipboard!
    </div>

    <script>
        const serverIP = "kurdosmp.net";

        // Live Server Status Fetch
        async function updateStatus() {
            try {
                const response = await fetch(`https://api.mcsrvstat.us/3/${serverIP}`);
                const data = await response.json();

                const dot = document.getElementById('status-dot');
                const countText = document.getElementById('player-count');

                if (data.online) {
                    dot.className = "pulse-dot online";
                    countText.innerHTML = `Online: <strong>${data.players.online}</strong> / ${data.players.max} Players`;
                } else {
                    dot.className = "pulse-dot offline";
                    countText.innerText = "Server Maintenance";
                }
            } catch (err) {
                document.getElementById('player-count').innerText = "Status Unavailable";
            }
        }

        // Copy IP Notification Event
        document.getElementById('ip-card').addEventListener('click', () => {
            navigator.clipboard.writeText(serverIP);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        });

        updateStatus();
    </script>
</body>
</html>
