<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdoSMP — Official Server</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #09090d;
            --card-bg: rgba(18, 18, 26, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --gold-primary: #ffb700;
            --gold-glow: rgba(255, 183, 0, 0.25);
            --text-main: #f3f3f7;
            --text-muted: #8b8ba7;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Effects */
        .ambient-glow-1 {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 183, 0, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -20%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 122, 61, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Card Wrapper */
        .card {
            position: relative;
            z-index: 10;
            max-width: 580px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* Branding Header */
        .brand-header {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 18px;
            border-radius: 50px;
            margin-bottom: 28px;
        }

        /* Detailed Kurdistan Flag */
        .kurd-flag {
            width: 32px;
            height: 22px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .flag-red { background: #EE2324; flex: 1; }
        .flag-white { 
            background: #FFFFFF; 
            flex: 1; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flag-green { background: #007A3D; flex: 1; }

        .sun-icon {
            position: absolute;
            width: 11px;
            height: 11px;
            fill: #FECC00;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Titles & Descriptions */
        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #FFFFFF 30%, #a5a5b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 span {
            background: linear-gradient(135deg, #ffc837 0%, #ff8000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Countdown Section */
        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 8px;
            border-radius: 14px;
        }

        .time-box .num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold-primary);
            display: block;
        }

        .time-box .label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Copy Server IP Component */
        .ip-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .ip-box {
            background: rgba(13, 13, 18, 0.8);
            border: 1px dashed rgba(255, 183, 0, 0.4);
            border-radius: 16px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .ip-box:hover {
            border-color: var(--gold-primary);
            background: rgba(22, 22, 30, 0.9);
            box-shadow: 0 10px 25px var(--gold-glow);
            transform: translateY(-2px);
        }

        .ip-details {
            text-align: left;
        }

        .ip-details span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .ip-details strong {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            color: #ffffff;
        }

        .copy-btn {
            background: var(--gold-primary);
            color: #000;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .ip-box:hover .copy-btn {
            background: #ffd000;
        }

        /* Live Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 32px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            position: relative;
        }

        .pulse-dot.online {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .pulse-dot.online::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 1.8s infinite ease-in-out;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .pulse-dot.offline { background: var(--danger); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        /* Quick Action Links */
        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .action-btn {
            flex: 1;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .action-btn.discord:hover {
            color: #5865F2;
            border-color: rgba(88, 101, 242, 0.4);
        }

        /* Toast Popup Notification */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold-primary);
            color: #0d0d12;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px var(--gold-glow);
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            bottom: 30px;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 2.1rem; }
            .countdown-container { grid-template-columns: repeat(2, 1fr); }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="card">
        <!-- Brand Badge -->
        <div class="brand-header">
            <div class="kurd-flag" title="Kurdistan">
                <div class="flag-red"></div>
                <div class="flag-white">
                    <svg class="sun-icon" viewBox="0 0 24 24">
                        <path d="M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,2A1,1 0 0,1 13,3V5A1,1 0 0,1 11,5V3A1,1 0 0,1 12,2M12,19A1,1 0 0,1 13,20V22A1,1 0 0,1 11,22V20A1,1 0 0,1 12,19M22,12A1,1 0 0,1 21,13H19A1,1 0 0,1 19,11H21A1,1 0 0,1 22,12M5,12A1,1 0 0,1 4,13H2A1,1 0 0,1 2,11H4A1,1 0 0,1 5,12M19.07,4.93A1,1 0 0,1 19.07,6.34L17.66,7.76A1,1 0 0,1 16.24,6.34L17.66,4.93A1,1 0 0,1 19.07,4.93M6.34,17.66A1,1 0 0,1 6.34,19.07L4.93,20.49A1,1 0 0,1 3.51,19.07L4.93,17.66A1,1 0 0,1 6.34,17.66M4.93,4.93A1,1 0 0,1 6.34,4.93L7.76,6.34A1,1 0 0,1 6.34,7.76L4.93,6.34A1,1 0 0,1 4.93,4.93M17.66,17.66A1,1 0 0,1 19.07,17.66L20.49,19.07A1,1 0 0,1 19.07,20.49L17.66,19.07A1,1 0 0,1 17.66,17.66Z" />
                    </svg>
                </div>
                <div class="flag-green"></div>
            </div>
            <span class="brand-title">KurdoSMP</span>
        </div>

        <!-- Heading -->
        <h1>Something Big Is <span>Coming Soon</span></h1>
        <p class="description">Our web ecosystem is currently under active development. You can still hop into the server and play right now!</p>

        <!-- Countdown Timer -->
        <div class="countdown-container">
            <div class="time-box">
                <span class="num" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="num" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="num" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="num" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>

        <!-- Server IP Box -->
        <div class="ip-wrapper">
            <div class="ip-box" id="ip-card">
                <div class="ip-details">
                    <span>Java / Bedrock Address</span>
                    <strong>kurdosmp.net</strong>
                </div>
                <div class="copy-btn">
                    <i class="fa-regular fa-copy"></i> Copy
                </div>
            </div>
        </div>

        <!-- Live Server Status -->
        <div class="status-badge">
            <div class="pulse-dot" id="status-dot"></div>
            <span id="player-count">Checking network status...</span>
        </div>

        <!-- Links -->
        <div class="actions">
            <a href="https://discord.gg/yourinvite" target="_blank" class="action-btn discord">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
            <a href="https://store.kurdosmp.net" target="_blank" class="action-btn">
                <i class="fa-solid fa-cart-shopping"></i> Web Store
            </a>
        </div>
    </div>

    <!-- Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> IP Copied to Clipboard!
    </div>

    <script>
        const serverIP = "kurdosmp.net";

        // Fetch Live Server Status
        async function updateStatus() {
            try {
                const response = await fetch(`https://api.mcsrvstat.us/3/${serverIP}`);
                const data = await response.json();

                const dot = document.getElementById('status-dot');
                const countText = document.getElementById('player-count');

                if (data.online) {
                    dot.className = "pulse-dot online";
                    countText.innerHTML = `Online: <strong>${data.players.online}</strong> / ${data.players.max} Players`;
                } else {
                    dot.className = "pulse-dot offline";
                    countText.innerText = "Server Maintenance";
                }
            } catch (err) {
                document.getElementById('player-count').innerText = "Status Unavailable";
            }
        }

        // Copy IP Notification Handler
        document.getElementById('ip-card').addEventListener('click', () => {
            navigator.clipboard.writeText(serverIP);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        });

        // Simple Target Launch Countdown (Adjust target date as needed)
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 14); // 14 Days from now

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance < 0) return;

            document.getElementById('days').innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById('minutes').innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById('seconds').innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
        updateStatus();
    </script>
</body>
</html>
