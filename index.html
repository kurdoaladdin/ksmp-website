<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdoSMP - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f0f13;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #181820;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #2a2a38;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            color: #ffaa00;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1rem;
            color: #a0a0b0;
            margin-bottom: 25px;
        }
        .ip-box {
            background: #0f0f13;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-block;
            border: 1px dashed #ffaa00;
            font-family: monospace;
            font-size: 1.2rem;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KURDOSMP</h1>
        <p>Our official Minecraft SMP website is currently under construction. Stay tuned!</p>
        <div class="ip-box">Play: play.kurdosmp.net</div>

</html>
